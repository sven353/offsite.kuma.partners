<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Barcelona Offsite Configurator | Kuma Partners</title>
<meta name="description" content="Configure a tailored executive offsite in Barcelona. Operator-led strategic alignment and friction resolution for scale-stage leadership teams.">
<link rel="icon" href="/assets/logo-icon.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<!--
  Netlify form detection note: Netlify's build bot scans the static HTML for
  a <form> with a matching name + data-netlify="true" attribute. The real
  form is rendered dynamically by app.js once the blueprint is compiled, so
  this hidden duplicate exists purely so Netlify registers the form fields
  at deploy time. Do not remove it, and keep its field names in sync with
  the one app.js renders (see renderLeadForm in app.js).
-->
<form name="offsite-blueprint" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="offsite-blueprint">
  <input type="text" name="bot-field">
  <input type="hidden" name="blueprint_title">
  <input type="hidden" name="selection_archetype">
  <input type="hidden" name="selection_tension">
  <input type="hidden" name="selection_setting">
  <input type="hidden" name="selection_hospitality">
  <input type="hidden" name="selection_facilitation">
  <input type="email" name="email">
  <input type="text" name="name">
  <input type="text" name="company">
  <select name="timeline">
    <option value="Q1 2027">Q1 2027</option>
    <option value="Q2 2027">Q2 2027</option>
    <option value="Q3 2027">Q3 2027</option>
    <option value="Q4 2027">Q4 2027</option>
    <option value="Flexible / not sure yet">Flexible / not sure yet</option>
  </select>
</form>

<header class="app-header">
  <div class="wrap app-header-inner">
    <a href="/" class="brand-lockup">KUMA PARTNERS</a>
    <span id="step-counter" class="step-counter">Step 01 of 05</span>
  </div>
  <p class="app-subtitle wrap">Operator-led strategic alignment and friction resolution for scale-stage companies.</p>
  <div class="progress-track">
    <div id="progress-fill" class="progress-fill" style="width:20%"></div>
  </div>
</header>

<main class="wrap app-main">
  <button type="button" id="back-btn" class="back-btn" hidden>&larr; Back</button>

  <section id="configurator">
    <div id="step-container" class="step-container"></div>
  </section>

  <section id="blueprint" hidden></section>
</main>

<footer class="app-footer">
  <div class="wrap footer-inner">
    <span>© 2026 Kuma Partners. All rights reserved.</span>
    <a href="mailto:contact@kuma.partners">contact@kuma.partners</a>
  </div>
</footer>

<script src="/app.js"></script>
</body>
</html>
